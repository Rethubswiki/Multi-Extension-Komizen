name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Kotlin 2.4.20-Beta2
        run: |
          wget https://github.com/JetBrains/kotlin/releases/download/v2.4.20-Beta2/kotlin-compiler-2.4.20-Beta2.zip
          unzip kotlin-compiler-2.4.20-Beta2.zip
          echo "$PWD/kotlinc/bin" >> $GITHUB_PATH

      - name: Run generator
        run: kotlin generate.kts

      - name: Prepare pages folder
        run: |
          mkdir -p pages
          cp array.json pages/
          cp array.min.json pages/
          cp index.json pages/
          cp index.min.json pages/
          cp -r repo pages/
          cp .nojekyll pages/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
