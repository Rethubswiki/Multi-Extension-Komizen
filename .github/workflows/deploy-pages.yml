name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install protobuf compiler & Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          pip install protobuf

      - name: Generate .pb files from JSON
        run: python generate_komizen.py

      - name: Prepare pages folder
        run: |
          mkdir -p pages/repo
          # Copy JSONs (root)
          cp array.json pages/ 2>/dev/null || true
          cp array.min.json pages/ 2>/dev/null || true
          cp index.json pages/ 2>/dev/null || true
          cp index.min.json pages/ 2>/dev/null || true
          # Copy repo JSONs
          cp repo/index.json pages/repo/ 2>/dev/null || true
          cp repo/index.min.json pages/repo/ 2>/dev/null || true
          # Copy .pb files (if generated)
          cp index.pb pages/ 2>/dev/null || true
          cp repo/index.pb pages/repo/ 2>/dev/null || true
          cp repo/index.min.pb pages/repo/ 2>/dev/null || true
          # Copy sources (optional)
          cp -r sources pages/ 2>/dev/null || true
          # Copy .nojekyll
          cp .nojekyll pages/ 2>/dev/null || true
          # Debug: list contents
          ls -laR pages/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
