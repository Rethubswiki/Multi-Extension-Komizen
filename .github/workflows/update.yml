name: Update Komizen Extensions

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Kotlin 2.4.20-Beta2
        run: |
          wget https://github.com/JetBrains/kotlin/releases/download/v2.4.20-Beta2/kotlin-compiler-2.4.20-Beta2.zip
          unzip kotlin-compiler-2.4.20-Beta2.zip
          echo "$PWD/kotlinc/bin" >> $GITHUB_PATH

      - name: Run generator
        run: kotlin generate.kts

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo/ array.json array.min.json index.json index.min.json
          git diff --staged --quiet || git commit -m "chore: update Komizen extensions"
          git push
