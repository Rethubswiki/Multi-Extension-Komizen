name: Update Komizen Extensions

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Kotlin 2.4.20-Beta2
        run: |
          KOTLIN_VERSION=2.4.20-Beta2
          wget -q "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q "kotlin-compiler-${KOTLIN_VERSION}.zip"
          echo "${PWD}/kotlinc/bin" >> "$GITHUB_PATH"
          kotlinc -version

      - name: Generate Komizen extensions
        run: |
          kotlin generate.kts

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "No hay cambios para subir."
          else
            git commit -m "chore: update Komizen extensions"
            git push
          fi
